version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directories: [/migrator, /services/alerts]
    schedule: { interval: monthly }
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/migrator, /services/alerts]
    schedule: { interval: monthly }
  - package-ecosystem: terraform
    directory: /deploy/aws
    schedule: { interval: monthly }
