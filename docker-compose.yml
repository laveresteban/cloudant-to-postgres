services:
  # Stands in for IBM Cloudant. The migrator talks to the same _changes API,
  # so pointing COUCH_URL at a Cloudant URL is the only change for production.
  couchdb:
    image: couchdb:3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    volumes:
      - couchdata:/opt/couchdb/data
    ports: ["5984:5984"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: showcase
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrator/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db:/sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d showcase"]
      interval: 3s
      retries: 20

  # The streaming microservice: backfills from seq 0, then keeps tailing the feed.
  migrator:
    build: ./migrator
    environment:
      COUCH_URL: http://couchdb:5984
      COUCH_DB: shop
      COUCH_USER: admin
      COUCH_PASSWORD: admin
      DATABASE_URL: postgres://app:app@postgres:5432/showcase
    ports: ["8090:8090"]
    depends_on:
      postgres: { condition: service_healthy }
      couchdb: { condition: service_started }

  # Microservice: consumes the migrator's change feed and turns changes into alerts.
  alerts:
    build: ./services/alerts
    environment:
      FEED_URL: http://migrator:8090
      DATABASE_URL: postgres://app:app@postgres:5432/showcase
      HIGH_VALUE_THRESHOLD: "1000"
    ports: ["8095:8095"]
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_started }

  # The browser app: a live order board built from the change feed plus alerts.
  app:
    image: nginx:1.27-alpine
    volumes:
      - ./app:/usr/share/nginx/html:ro
    ports: ["8080:80"]

volumes:
  couchdata:
  pgdata:
